<style>

  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column;}

  header h1{font-size:22px; font-weight:800; letter-spacing:-.5px;}

  header p{color:var(--muted); font-size:13px; width:100%;}

  #top3{display:flex; gap:10px; padding:4px 22px 12px; flex-wrap:wrap;}
  .top-card{background:linear-gradient(135deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:190px; cursor:pointer; transition:.15s;}
  .top-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .top-card .rank{font-size:12px; color:var(--accent); font-weight:700;}
  .top-card .nm{font-weight:700; font-size:15px; margin:2px 0;}
  .top-card .sc{font-size:13px; color:var(--muted);}
  .top-card .sc b{font-size:18px;}
  #filters{display:flex; gap:8px; padding:0 22px 12px; flex-wrap:wrap;}
  #filters button{background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit;}
  #filters button.on{background:var(--accent); color:#1a1a1a; border-color:var(--accent); font-weight:700;}
  main{flex:1; display:flex; gap:0; min-height:0; padding:0 22px;}
  #map{flex:1.6; min-height:520px; border-radius:14px; border:1px solid var(--line); z-index:1; background:#0e1430;}
  aside{flex:1; max-width:380px; margin-left:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; overflow-y:auto; max-height:70vh;}
  aside h2{font-size:18px; margin-bottom:2px;}
  .badges{display:flex; gap:6px; margin:8px 0 10px; flex-wrap:wrap;}
  .badge{font-size:12px; padding:3px 10px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted);}
  .desc{font-size:14px; line-height:1.6; color:#d6dbf5; margin-bottom:12px;}
  .fac{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .fac div{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px;}
  .fac div span{display:block; font-size:11px; color:var(--muted); margin-bottom:2px;}
  .wx-now{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .wx-now .t{font-size:34px; font-weight:800;}
  .wx-now .c{font-size:13px; color:var(--muted); line-height:1.5;}
  .wx-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .wx-grid div{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 4px; text-align:center; font-size:13px;}
  .wx-grid div span{display:block; font-size:11px; color:var(--muted); margin-bottom:3px;}

  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle;}

window.addEventListener("error", function(e){
  var bar = document.getElementById("errbar");

  var isRes = e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK");
  bar.style.display = "block";
  bar.textContent = isRes
    ? "⚠️ 외부 라이브러리를 불러오지 못했어요. 네트워크 연결을 확인하거나, 파일을 크롬/사파리에서 직접 열어보세요."

</script>

function moonInfo(date){
  const synodic = 29.53058867;
  const known = Date.UTC(2000,0,6,18,14);
  const age = (((date.getTime()-known)/86400000) % synodic + synodic) % synodic;
  const illum = (1 - Math.cos(2*Math.PI*age/synodic)) / 2;
  let name, emoji;
  if(age < 1.5 || age > 28){ name="삭 (신월)"; emoji="🌑"; }
  else if(age < 7.4){ name="초승달"; emoji="🌒"; }
  else if(age < 8.9){ name="상현달"; emoji="🌓"; }
  else if(age < 13.8){ name="보름에 가까움"; emoji="🌔"; }
  else if(age < 16.2){ name="보름 (망)"; emoji="🌕"; }
  else if(age < 21.1){ name="보름 지남"; emoji="🌖"; }
  else if(age < 22.6){ name="하현달"; emoji="🌗"; }
  else { name="그믐달"; emoji="🌘"; }
  return {age, illum, name, emoji};
}

function tonightHours(){
  const now = new Date();
  const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const t0 = fmt(now), t1 = fmt(new Date(now.getTime()+86400000));
  const hs = [];
  for(let h=18; h<24; h++) hs.push(t0+"T"+String(h).padStart(2,"0")+":00");
  for(let h=0; h<=5; h++) hs.push(t1+"T"+String(h).padStart(2,"0")+":00");
  return hs;
}

function starScore(cloudAvg, moonIllum){
  return Math.max(0, Math.round((100 - cloudAvg*1.15) - moonIllum*35));
}
function grade(s){
  if(s>=80) return ["환상적 🌟","#4ade80"];
  if(s>=60) return ["좋음 ✨","#4ade80"];
  if(s>=40) return ["보통","#facc15"];
  if(s>=20) return ["아쉬움","#f87171"];
  return ["별 보기 어려움","#f87171"];
}
function scoreColor(s){
  if(s==null) return "#9ca3af";
  if(s>=70) return "#4ade80";
  if(s>=40) return "#facc15";
  return "#f87171";
}

let map = null;
const markers = [];
let activeFilter = "all";
let wxData = {};

function makeIcon(color){
  return L.divIcon({className:"", html:'<div class="mk" style="background:'+color+'"></div>', iconSize:[22,22], iconAnchor:[11,11]});
}

function renderSpotCards(){
  const box = document.getElementById("spotCards");
  if(!box) return;
  box.innerHTML = SPOTS.map((s,i)=>{
    if(activeFilter!=="all" && s.region!==activeFilter) return "";
    const w = wxData[i];
    const sc = w ? (w.ok ? '<b style="color:'+scoreColor(w.score)+'">'+w.score+'점</b>' : "날씨 실패")
                 : "측정 중…";
    return '<div class="spot-card" onclick="showPanel('+i+')">'
      + '<div class="nm">'+s.name+'</div>'
      + '<div class="rg">'+s.region+' · '+s.type+'</div>'
      + '<div class="sc" id="card-score-'+i+'">별보기 '+sc+'</div></div>';
  }).join("");
}

if(HAS_MAP){
  map = L.map("map").setView([36.4, 127.9], 7);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
    attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
    maxZoom:19
  }).addTo(map);
  SPOTS.forEach((s,i)=>{
    const m = L.marker([s.lat,s.lng],{icon:makeIcon("#9ca3af")}).addTo(map);
    m.on("click", ()=>showPanel(i));
    markers.push(m);
  });
}else{
  document.getElementById("map").innerHTML =
    '<div class="fallback"><div class="fb-notice">🗺️ 지도 라이브러리를 불러오지 못했어요.<br>'
    + '미리보기 환경이나 네트워크 문제일 수 있어요. 파일은 크롬/사파리에서 직접 열면 지도가 정상 표시됩니다.<br>'
    + '아래 목록에서 스팟별 실시간 날씨와 별보기 지수는 그대로 볼 수 있어요 👇</div>'
    + '<div id="spotCards"></div></div>';
  renderSpotCards();
}

document.querySelectorAll("#filters button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("#filters button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    activeFilter = btn.dataset.f;
    if(HAS_MAP){
      SPOTS.forEach((s,i)=>{
        const show = activeFilter==="all" || s.region===activeFilter;
        if(show && !map.hasLayer(markers[i])) markers[i].addTo(map);
        if(!show && map.hasLayer(markers[i])) map.removeLayer(markers[i]);
      });
    }else{
      renderSpotCards();
    }
  });
});

async function fetchWeather(s){
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+s.lat+"&longitude="+s.lng
    + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m"
    + "&hourly=cloud_cover&timezone=Asia%2FSeoul&forecast_days=2";
  const r = await fetch(url);
  if(!r.ok) throw new Error("wx");
  return r.json();
}

function analyze(d){
  const th = tonightHours();
  const idx = th.map(t=>d.hourly.time.indexOf(t)).filter(x=>x>=0);
  const clouds = idx.map(x=>d.hourly.cloud_cover[x]);
  const avg = clouds.length ? clouds.reduce((a,b)=>a+b,0)/clouds.length : d.current.cloud_cover;
  return {avg};
}

function showPanel(i){
  const s = SPOTS[i], panel = document.getElementById("panel");
  const w = wxData[i];
  const moon = moonInfo(new Date());
  let html = "<h2>"+s.name+"</h2>"
    + '<div class="badges"><span class="badge">'+s.region+'</span><span class="badge">'+s.type+"</span></div>"
    + '<p class="desc">'+s.desc+"</p>"
    + '<div class="fac"><div><span>화장실</span>'+s.toilet+"</div>"
    + "<div><span>취사</span>"+s.cooking+"</div></div>";
  if(w && w.ok){
    const c = w.data.current, a = w.analyzed;
    const score = starScore(a.avg, moon.illum);
    const g = grade(score);
    html += '<div class="wx-now"><div class="t">'+Math.round(c.temperature_2m)+'°</div>'
      + '<div class="c">'+(WMO[c.weather_code]||"알 수 없음")+"<br>업데이트: "+c.time.slice(11,16)+"</div></div>"
      + '<div class="wx-grid">'
      + "<div><span>체감</span>"+Math.round(c.apparent_temperature)+"°</div>"
      + "<div><span>구름</span>"+c.cloud_cover+"%</div>"
      + "<div><span>바람</span>"+c.wind_speed_10m.toFixed(1)+"m/s</div>"
      + "<div><span>습도</span>"+c.relative_humidity_2m+"%</div></div>"
      + '<div class="star-box"><div class="score">'+score+'<span style="font-size:16px">/100</span></div>'
      + '<div class="grade" style="color:'+g[1]+'">'+g[0]+"</div>"
      + '<div class="moon">'+moon.emoji+" "+moon.name+" · 달 밝기 "+Math.round(moon.illum*100)
      + "% · 오늘 밤 평균 구름 "+Math.round(a.avg)+"%</div></div>";
  }else{
    html += '<div class="loading">날씨 정보를 불러오지 못했어요. 잠시 후 다시 눌러보세요.</div>';
  }
  if(s.warn) html += '<div class="note warn" style="margin-top:4px">⚠️ '+s.warn+"</div>";
  panel.innerHTML = html;
}

async function init(){
  document.getElementById("top3").innerHTML = '<div class="loading">20곳의 오늘 밤 하늘을 읽는 중…</div>';
  const moon = moonInfo(new Date());
  let results = [];
  try{
    results = await Promise.allSettled(SPOTS.map(s=>fetchWeather(s)));
  }catch(e){ results = []; }
  results.forEach((r,i)=>{
    if(r.status==="fulfilled"){
      const analyzed = analyze(r.value);
      const score = starScore(analyzed.avg, moon.illum);
      wxData[i] = {ok:true, data:r.value, analyzed, score};
      if(HAS_MAP) markers[i].setIcon(makeIcon(scoreColor(score)));
    }else{
      wxData[i] = {ok:false};
    }
  });

  const ranked = SPOTS.map((s,i)=>({i, score: wxData[i] && wxData[i].ok ? wxData[i].score : -1}))
    .filter(x=>x.score>=0).sort((a,b)=>b.score-a.score).slice(0,3);
  const medals = ["🥇","🥈","🥉"];
  document.getElementById("top3").innerHTML = ranked.length
    ? '<div style="width:100%;font-size:13px;color:var(--muted);margin-bottom:2px">오늘 밤 별보기 TOP 3</div>' + ranked.map((r,k)=>{
        const s = SPOTS[r.i];
        return '<div class="top-card" onclick="showPanel('+r.i+')">'
          + '<div class="rank">'+medals[k]+' 오늘 밤</div>'
          + '<div class="nm">'+s.name+"</div>"
          + '<div class="sc"><b style="color:'+scoreColor(r.score)+'">'+r.score+"</b>점 · "+s.region
          + " · 구름 "+Math.round(wxData[r.i].analyzed.avg)+"%</div></div>";
      }).join("")
    : '<div class="loading">날씨 정보를 가져오지 못했어요. 네트워크 연결을 확인해주세요.</div>';

  if(!HAS_MAP) renderSpotCards();
}
init();
</script>
</body>
</html>
